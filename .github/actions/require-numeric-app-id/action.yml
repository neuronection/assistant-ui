name: Require a numeric App ID
description: >-
  Fails with an actionable message when RELEASE_APP_ID holds the App's Client ID
  (Iv23…) instead of its numeric App ID. GitHub's own error for that mistake is
  `'Issuer' claim ('iss') must be an Integer`, which says nothing about where
  the value came from.
inputs:
  app-id:
    description: The value stored in RELEASE_APP_ID.
    required: true
runs:
  using: composite
  steps:
    - name: Check the App ID shape
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
      run: |
        set -euo pipefail
        if [ -z "${APP_ID}" ]; then
          echo "::error::RELEASE_APP_ID is empty."
          exit 1
        fi
        case "${APP_ID}" in
          *[!0-9]*)
            echo "::error::RELEASE_APP_ID is not the numeric App ID. GitHub rejects the JWT with \"'Issuer' claim ('iss') must be an Integer\" when it holds the App's Client ID (Iv…) or the slug. Copy \`App ID\` — a number — from the App's settings page."
            exit 1
            ;;
        esac

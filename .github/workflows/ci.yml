name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      visual_only:
        description: 'Re-run only the visual baseline check (follow-up after rebaseline)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # Not cancel-in-progress: a superseding push must not cancel the
  # rebaseline job that opens the baseline PR.
  cancel-in-progress: false

jobs:
  lint:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Required-check mirror matches the workflow job names
        run: node scripts/check-required-checks.mjs
      - run: pnpm lint

  typecheck-react18:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D @types/react@^18 @types/react-dom@^18
      - run: pnpm typecheck

  typecheck-react19:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  test-react18:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add -D react@^18 react-dom@^18
      - run: pnpm test

  build:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: react18-tailwind3
            react: '18'
            react-dom: '18'
            types: '@types/react@^18 @types/react-dom@^18'
            tailwind: 'tailwindcss@^3'
          - name: react19-tailwind4
            react: '19'
            react-dom: '19'
            types: '@types/react@^19 @types/react-dom@^19'
            tailwind: 'tailwindcss@^4'
    name: smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The artifact `build` uploaded is the artifact that ships: smoke packs
      # this instead of rebuilding (two redundant ~4 min builds before).
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist
      - name: Verify the downloaded artifact layout
        run: test -f dist/index.js || { echo "unexpected artifact layout:"; find dist -maxdepth 2 | head; exit 1; }
      - run: pnpm pack --pack-destination /tmp
      - name: Scaffold consumer app
        run: |
          mkdir -p /tmp/smoke/src
          cp scripts/smoke/package.json /tmp/smoke/package.json
          cp scripts/smoke/smoke.test.tsx /tmp/smoke/src/smoke.test.tsx
      - name: Install library + app deps
        working-directory: /tmp/smoke
        run: |
          pnpm add "react@${{ matrix.react }}" "react-dom@${{ matrix.react-dom }}" ${{ matrix.types }} ${{ matrix.tailwind }} /tmp/neuronection-assistant-ui-*.tgz
          pnpm add -D vitest jsdom @testing-library/react @testing-library/user-event
      - name: Run smoke tests
        working-directory: /tmp/smoke
        run: pnpm vitest run

  stories:
    if: inputs.visual_only != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:css
      - run: pnpm playground:build

  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:visual
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  visual-rebaseline:
    needs: visual
    # W1 (plan 103): only from main. A feature-branch dispatch used to branch
    # from the dispatched ref, so the "baselines PR" carried feature commits
    # (PR #144) — and mergeable feature work would bypass review.
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.visual.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # to dispatch CI on the branch this job pushes (bot pushes do not trigger runs)
      actions: write
    env:
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # Plan 103 §13: push as a real actor so the baselines PR's own suite counts.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --update-snapshots
      - name: Open regenerated-baselines PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          if [[ -z "$(git status --porcelain tests/visual/__screenshots__)" ]]; then
            echo "Baselines already canonical"
            exit 0
          fi
          branch="chore/visual-rebaseline-${GITHUB_RUN_ID}"
          git config user.name "neuronection-bot"
          git config user.email "bot@neuronection.com"
          git checkout -b "$branch"
          git add tests/visual/__screenshots__
          git commit -m "chore(visual): rebaseline gallery from the CI runner"
          git push -u origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(visual): rebaseline gallery" \
            --body "Regenerated by the CI \`visual-rebaseline\` job on the CI runner — never locally. The PR's own visual job validates the new baselines, and required checks gate the merge."
          echo "::notice::Baselines PR opened from $branch"
          # Without an App token the push above starts no workflow; dispatch CI
          # so the jobs at least run. With one, the push itself reports checks.
          if [ -z "${{ steps.app-token.outputs.token }}" ]; then
            gh workflow run ci.yml --ref "$branch"
          fi

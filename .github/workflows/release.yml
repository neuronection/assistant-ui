name: Release

# W0 (plan 103): publish only after CI on the same commit succeeded.
# `workflow_run` gives us the CI verdict for this exact SHA; the previous
# `push` trigger raced CI and could publish a red commit (0.91.0 published
# 3 minutes before its own CI finished).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write
  # to kick CI on the bot-created Version Packages branch (see last step)
  actions: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the SHA CI validated, not the (possibly newer) branch head
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `dist/` is gitignored and `files` ships it, so the published tarball
      # needs a build in this job. Tests/lint/typecheck are NOT repeated here:
      # W0 gates on the CI run for this SHA.
      - name: Build the published artifacts
        run: pnpm build

      # W7 (plan 103): a stray pre-mode would publish a prerelease and move the
      # `latest` dist-tag under every consumer's feet. Refuse instead.
      - name: Refuse pre-mode
        run: |
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json is present — refusing to publish from main while in pre-mode."
            exit 1
          fi

      # W3b (plan 103): `changeset publish` shells out to `pnpm publish`, and
      # pnpm only honours provenance as a CLI flag — neither
      # NPM_CONFIG_PROVENANCE nor `.npmrc: provenance=true` reaches it, which is
      # why 0.90.0 and 0.91.0 are unsigned despite the old env var. A shim first
      # on PATH injects the flag into that one child process, so releases are
      # signed without patching @changesets/cli.
      - name: Make the publish tool sign its artifacts
        run: |
          set -euo pipefail
          real="$(command -v pnpm)"
          # Outside the work tree on purpose: changesets/action runs `git add .`
          # for the Version Packages commit, and a shim in the repo root would
          # be committed into it.
          shim="${RUNNER_TEMP}/provenance-shim"
          mkdir -p "$shim"
          cat > "$shim/pnpm" <<SH
          #!/usr/bin/env bash
          if [ "\$1" = "publish" ]; then
            exec "$real" publish --provenance "\${@:2}"
          fi
          exec "$real" "\$@"
          SH
          chmod +x "$shim/pnpm"
          echo "$shim" >> "$GITHUB_PATH"
          echo "shim -> $real"

      - uses: changesets/action@ce079ea084e08a340947ed4d6ecedb2433c8f293 # v1.9.0
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # W1: a branch pushed with GITHUB_TOKEN never starts workflows, so the
      # Version Packages PR shows 0 jobs and its required checks can never
      # report. `workflow_dispatch` is exempt from that suppression; kick CI
      # on the bot branch so the PR validates itself.
      - name: Kick CI for the Version Packages PR
        if: steps.changesets.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="changeset-release/main"
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" >/dev/null 2>&1; then
            gh workflow run ci.yml --ref "$branch"
            echo "::notice::CI dispatched for $branch"
          else
            echo "No Version Packages branch present; nothing to dispatch."
          fi

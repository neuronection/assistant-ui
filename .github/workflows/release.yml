name: Release

# W0 (plan 103): publish only after CI on the same commit succeeded.
# `workflow_run` gives us the CI verdict for this exact SHA; the previous
# `push` trigger raced CI and could publish a red commit (0.91.0 published
# 3 minutes before its own CI finished).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Secrets cannot be referenced in an `if:`, so surface their presence here.
      HAS_RELEASE_APP: ${{ secrets.RELEASE_APP_ID != '' && secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      # W1 (plan 103 §13): a branch pushed with GITHUB_TOKEN starts no workflow,
      # so the Version Packages PR shows 0 jobs and its required checks never
      # count. A dispatch runs the jobs but GitHub still excludes it from the
      # PR rollup. An App installation token is the actor that makes the PR's
      # own suite count. Absent the secrets, everything falls back to
      # GITHUB_TOKEN plus the dispatch step below.
      - name: The App ID is numeric, not the Client ID
        if: env.HAS_RELEASE_APP == 'true'
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ID}" ]; then
            echo "::error::RELEASE_APP_ID is empty."
            exit 1
          fi
          case "${APP_ID}" in
            *[!0-9]*)
              hint=""
              case "${APP_ID}" in
                Iv*) hint=" It starts with 'Iv' — that is the Client ID." ;;
                *[[:space:]]*) hint=" It contains whitespace — strip it." ;;
                *) hint=" Expected the number shown as 'App ID' in the App's settings." ;;
              esac
              echo "::error::RELEASE_APP_ID is not the numeric App ID (GitHub then fails the JWT with: Issuer claim iss must be an Integer).${hint}"
              exit 1
              ;;
          esac

      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        id: app-token
        if: env.HAS_RELEASE_APP == 'true'
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the SHA CI validated, not the (possibly newer) branch head
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `dist/` is gitignored and `files` ships it, so the published tarball
      # needs a build in this job. Tests/lint/typecheck are NOT repeated here:
      # W0 gates on the CI run for this SHA.
      - name: Build the published artifacts
        run: pnpm build

      # The CI conclusion alone is not enough: `scan` (gitleaks) is a separate
      # workflow that finishes later, and the ruleset's required set is the
      # contract, not this workflow's trigger. Assert every context is green on
      # this exact commit before anything is published.
      - name: Every required check is green for this commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          node -e "console.log(require('./.github/required-checks.json').contexts.join('\n'))" \
            > "${RUNNER_TEMP}/required.txt"
          pending=""
          for attempt in $(seq 1 30); do
            pending=""
            while IFS= read -r context; do
              report="$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?filter=latest&per_page=100" \
                --jq ".check_runs[] | select(.name == \"${context}\") | .status + \"/\" + (.conclusion // \"pending\")" \
                || true)"
              state="$(printf '%s\n' "${report}" | sed -n '1p')"
              case "${state}" in
                completed/success) ;;
                *) pending="${pending}\n  ${context}: ${state:-not reported}" ;;
              esac
            done < "${RUNNER_TEMP}/required.txt"
            if [ -z "${pending}" ]; then
              echo "all required checks are green on ${SHA}"
              exit 0
            fi
            echo "waiting for required checks (attempt ${attempt})"
            sleep 20
          done
          printf '::error::required checks not green on %s:%b\n' "${SHA}" "${pending}"
          exit 1

      # W7 (plan 103): a stray pre-mode would publish a prerelease and move the
      # `latest` dist-tag under every consumer's feet. Refuse instead.
      - name: Refuse pre-mode or a prerelease version
        run: |
          set -euo pipefail
          if [ -f .changeset/pre.json ]; then
            echo "::error::.changeset/pre.json is present — refusing to publish from main while in pre-mode."
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          case "${version}" in
            *-*)
              echo "::error::package.json version ${version} is a prerelease; publishing it would move the latest dist-tag. Refusing."
              exit 1
              ;;
          esac

      # W3b (plan 103): `changeset publish` shells out to `pnpm publish`, and
      # pnpm only honours provenance as a CLI flag — neither
      # NPM_CONFIG_PROVENANCE nor `.npmrc: provenance=true` reaches it, which is
      # why 0.90.0 and 0.91.0 are unsigned despite the old env var. A shim first
      # on PATH injects the flag into that one child process, so releases are
      # signed without patching @changesets/cli.
      - name: Make the publish tool sign its artifacts
        run: |
          set -euo pipefail
          real="$(command -v pnpm)"
          # Outside the work tree on purpose: changesets/action runs `git add .`
          # for the Version Packages commit, and a shim in the repo root would
          # be committed into it.
          shim="${RUNNER_TEMP}/provenance-shim"
          mkdir -p "$shim"
          cat > "$shim/pnpm" <<SH
          #!/usr/bin/env bash
          if [ "\$1" = "publish" ]; then
            exec "$real" publish --provenance "\${@:2}"
          fi
          exec "$real" "\$@"
          SH
          chmod +x "$shim/pnpm"
          echo "$shim" >> "$GITHUB_PATH"
          echo "shim -> $real"

      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          version: pnpm changeset version
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # No CI dispatch step on purpose: the App token above makes the Version
      # Packages branch push start its own suite, and a dispatch would only add
      # a duplicate run. Without the App secrets, a human commit is required —
      # see docs/publishing.md.

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run gitleaks (working tree + full history)
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "${base}/${archive}" -o gitleaks.tgz
          curl -fsSL "${base}/gitleaks_${version}_checksums.txt" -o gitleaks-checksums.txt
          # A third-party binary is executed here: verify the published digest.
          grep " ${archive}\$" gitleaks-checksums.txt | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --redact -v

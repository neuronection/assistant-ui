version: 2
updates:
  # pnpm workspace (root + playground) — weekly, per family CI policy
  # (security.md: Dependabot on every GitHub repo).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
